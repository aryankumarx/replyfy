<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replyfy — AI Smart Replies (v1.4.0)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0e0e13;
      color: #f9f5fd;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ambient glow matching app radar */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(99, 102, 241, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      padding: 24px 20px;
    }



    /* Logo Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeInDown 0.6s ease;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 24px;
      margin-bottom: 16px;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
      font-size: 32px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f9f5fd;
    }

    .header p {
      color: #acaab1;
      font-size: 13px;
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 14px;
      background: #25252d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 10px;
      color: #a3a6ff;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Cards matching App s.card & s.feedCard */
    .card {
      background: #19191f;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 24px;
      animation: fadeInUp 0.5s ease;
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      color: #acaab1;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    /* Textarea */
    .input-wrapper {
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      background: #131319;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      color: #f9f5fd;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.3s;
      outline: none;
    }

    textarea:focus {
      border-color: #6063ee;
    }

    textarea::placeholder {
      color: #48474d;
    }

    .char-count {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-size: 11px;
      color: #76747b;
    }

    /* App Pill Button matching s.generateBtn */
    .btn-generate {
      width: 100%;
      padding: 18px;
      background: #6063ee;
      border: none;
      border-radius: 999px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.45);
    }

    .btn-generate:hover {
      background: #7376ff;
      box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
    }

    .btn-generate:active {
      transform: scale(0.99);
    }

    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-generate .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Suggestions Container */
    .suggestions-container {
      animation: fadeInUp 0.5s ease;
    }

    .suggestion-card {
      background: #19191f;
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .suggestion-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      background: #1f1f26;
      transform: translateX(4px);
    }

    .suggestion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .reply-tag {
      color: #a3a6ff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .reply-hint {
      color: #76747b;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .suggestion-text {
      color: #f9f5fd;
      font-size: 15px;
      line-height: 23px;
    }

    /* Toast matching s.toast */
    .toast {
      position: fixed;
      top: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #25252d;
      border: 1px solid rgba(99, 102, 241, 0.15);
      color: #f9f5fd;
      padding: 14px 24px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Error */
    .error-msg {
      text-align: center;
      color: #f43f5e;
      font-size: 12px;
      font-weight: 600;
      margin-top: 14px;
      padding: 12px;
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.2);
      border-radius: 12px;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      font-size: 11px;
      color: #acaab1;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .status-dot.offline {
      background: #f43f5e;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 36px;
      font-size: 12px;
      color: #76747b;
    }

    .footer a {
      color: #a3a6ff;
      text-decoration: none;
      font-weight: 700;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Logo Header -->
    <div class="header">
      <div class="logo-badge">⚡</div>
      <h1>Replyfy</h1>
      <p>Contextual AI replies for WhatsApp, Telegram & SMS</p>
      <span class="badge">GEMINI 2.5 FLASH-LITE</span>
    </div>

    <!-- Input Card matching s.feedCard / s.card -->
    <div class="card">
      <div class="card-label">LAST COPIED MESSAGE</div>
      <div class="input-wrapper">
        <textarea id="messageInput"
          placeholder="Copy a message from WhatsApp or paste here...&#10;&#10;Example: Hey! Are you free for dinner tonight?"
          maxlength="1000"></textarea>
        <span class="char-count" id="charCount">0 / 1000</span>
      </div>
      <button class="btn-generate" id="generateBtn">
        ⚡ GENERATE SMART REPLIES
      </button>
      <div id="errorMsg"></div>
    </div>

    <!-- Suggestions Container -->
    <div id="suggestionsContainer"></div>

    <!-- Status -->
    <div class="status-bar">
      <span><span class="status-dot" id="statusDot"></span> <span id="statusText">Checking API...</span></span>
      <span id="modelInfo">MODEL: GEMINI-2.5-FLASH-LITE</span>
    </div>

    <div class="footer">
      Built with ❤️ by <a href="https://github.com/aryankumarx" target="_blank">Aryan Kumar</a> ·
      <a href="https://github.com/aryankumarx/replyfy" target="_blank">GitHub</a>
    </div>
  </div>

  <!-- Toast matching app -->
  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    const API_URL = window.location.origin;

    const textarea = document.getElementById('messageInput');
    const charCount = document.getElementById('charCount');
    textarea.addEventListener('input', () => {
      charCount.textContent = `${textarea.value.length} / 1000`;
    });

    async function checkHealth() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      try {
        const res = await fetch(`${API_URL}/health`);
        if (res.ok) {
          dot.className = 'status-dot online';
          text.textContent = 'API ONLINE';
        } else throw new Error();
      } catch {
        dot.className = 'status-dot offline';
        text.textContent = 'API OFFLINE';
      }
    }
    checkHealth();

    let lastRequestTime = 0;
    const COOLDOWN_MS = 3000;

    async function generateSuggestions() {
      const message = textarea.value.trim();
      const btn = document.getElementById('generateBtn');
      const errorDiv = document.getElementById('errorMsg');
      const container = document.getElementById('suggestionsContainer');

      if (!message) {
        errorDiv.innerHTML = '<div class="error-msg">Please paste a message first!</div>';
        return;
      }

      const timeSinceLast = Date.now() - lastRequestTime;
      if (timeSinceLast < COOLDOWN_MS) {
        const waitSec = ((COOLDOWN_MS - timeSinceLast) / 1000).toFixed(0);
        errorDiv.innerHTML = `<div class="error-msg">⏳ Please wait ${waitSec}s before sending another request</div>`;
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> GENERATING...';
      errorDiv.innerHTML = '';
      container.innerHTML = '';
      lastRequestTime = Date.now();

      try {
        const res = await fetch(`${API_URL}/api/suggest`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': 'my-super-secret-key-12345'
          },
          body: JSON.stringify({
            message,
            userId: 'web-demo',
            userTier: 'free'
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Request failed');
        }

        renderSuggestions(data.suggestions, data.usage);

      } catch (err) {
        errorDiv.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '⚡ GENERATE SMART REPLIES';
        }, Math.max(0, COOLDOWN_MS - (Date.now() - lastRequestTime)));
      }
    }

    let _currentSuggestions = [];

    function renderSuggestions(suggestions, usage) {
      const container = document.getElementById('suggestionsContainer');
      _currentSuggestions = suggestions;

      let html = '';

      suggestions.forEach((s, i) => {
        const safeText = s.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `
        <div class="suggestion-card" data-index="${i}">
          <div class="suggestion-header">
            <span class="reply-tag">${(s.label || s.tone).toUpperCase()}</span>
            <span class="reply-hint">TAP TO COPY</span>
          </div>
          <div class="suggestion-text">${safeText}</div>
        </div>
      `;
      });

      if (usage) {
        html += `<div style="text-align:center;font-size:11px;color:#acaab1;margin-top:12px;letter-spacing:1px;">
        TODAY: ${usage.used}/${usage.limit} SUGGESTIONS USED · ${usage.remaining} REMAINING
      </div>`;
      }

      container.innerHTML = html;

      container.querySelectorAll('.suggestion-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.dataset.index, 10);
          copyText(_currentSuggestions[idx].text);
        });
      });
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      });
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('generateBtn').addEventListener('click', generateSuggestions);

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateSuggestions();
      }
    });
  </script>

</body>

</html>
